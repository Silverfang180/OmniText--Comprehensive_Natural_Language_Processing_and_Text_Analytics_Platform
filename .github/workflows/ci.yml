name: OmniText CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-checks:
    name: Backend Lint, Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install --no-deps -e "./apps/api"
          pip install pytest pytest-asyncio mypy ruff types-PyYAML types-aiofiles types-requests bcrypt PyJWT

      - name: Run Ruff Linter
        working-directory: apps/api
        run: ruff check .

      - name: Run Mypy Type Checker
        working-directory: apps/api
        env:
          PYTHONPATH: .
        run: mypy omnitext

      - name: Run Pytest Test Suite
        working-directory: apps/api
        env:
          PYTHONPATH: .
        run: pytest tests -v

  frontend-checks:
    name: Frontend Lint, Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package.json

      - name: Install Frontend Dependencies
        working-directory: apps/web
        run: npm ci || npm install

      - name: Run TypeScript Typecheck
        working-directory: apps/web
        run: npm run typecheck

      - name: Build Next.js Web App
        working-directory: apps/web
        run: npm run build
