name: Deploy to Hugging Face Spaces

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Pushes code to Hugging Face Space repository.
      # Make sure to add HF_TOKEN to your GitHub repo secrets.
      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::warning ::HF_TOKEN secret is not set in GitHub repository settings yet. Skipping auto-push to Hugging Face."
            exit 0
          fi
          git config --global user.email "deploy-bot@omnitext.org"
          git config --global user.name "OmniText Deploy Bot"
          git remote add hf "https://x-access-token:${HF_TOKEN}@huggingface.co/spaces/Silverfang180/omnitext-backend"
          git push --force hf main:main
